<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="shortcut icon" href="{{url_for('static', filename='img/favicon.png')}}" type="image/png">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="{{url_for('static', filename='css/style.css')}}">
    <title>{{title}}</title>
</head>
<body>
<div class="container">
    <div class="row">
        <header>
            <nav class="navbar navbar-light bg-light">
                <a href="/" class="navbar-brand">Главная</a>
                <a href="/contacts" class="navbar-brand">Контакты</a>
                <a href="/boardgames" class="navbar-brand">Игры</a>
                {% if current_user.is_authenticated %}
                <a href="/personal-page" class="navbar-brand">{{current_user.name}}</a>
                <a href="/logout" class="navbar-brand">Выход</a>
                {% else %}
                <a href="/login" class="navbar-brand">Авторизация</a>
                <a href="/register" class="navbar-brand">Регистрация</a>
                {% endif %}
            </nav>
        </header>
    </div>
    <div class="row">
        <main>
            {% block content %}{% endblock %}
        </main>
    </div>
    <p>&nbsp;</p>
    <div class="fixed-bottom">
        <footer class="bg-success text-white text-center py-1 font-monospace">
            <p>&copy; 2025 &dash; Компания "Настойки для настолки"</p>
        </footer>
    </div>
</div>
</body>
</html>
