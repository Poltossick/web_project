<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="shortcut icon" href="{{url_for('static', filename='img/favicon.png')}}" type="image/png">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="{{url_for('static', filename='css/style.css')}}">
    <title>{{title}}</title>
</head>
<body>
<header class="navbar navbar-expand-md navbar-dark bd-navbar">
    <nav class="container-xxl flex-wrap flex-md-nowrap" aria-label="Main navigation">
        <div class="collapse navbar-collapse" id="bdNavbar">
            <img src="/static/img/ikon.jpg" alt="" width="70" height="70">
            <ul class="navbar-nav flex-row flex-wrap bd-navbar-nav pt-2 py-md-0">
                <li class="nav-item col-6 col-md-auto">
                    <a href="/" class="nav-link p-2 ">Главная</a>
                </li>
                <li class="nav-item col-6 col-md-auto">
                    <a href="/contacts" class="nav-link p-2 ">Контакты</a>
                </li>
                <li class="nav-item col-6 col-md-auto">
                    <a href="/boardgames" class="nav-link p-2 ">Игры</a>
                </li>
                {% if current_user.is_authenticated %}
                <li class="nav-item col-6 col-md-auto">
                    <a href="/personal-page" class="nav-link p-2 ">{{current_user.name}}</a>
                <li class="nav-item col-6 col-md-auto">
                    <a href="/logout" class="nav-link p-2 ">Выход</a>
                </li>
                <li class="nav-item col-6 col-md-auto">
                    {% else %}
                    <a href="/login" class="nav-link p-2 ">Авторизация</a>
                </li>
                <li class="nav-item col-6 col-md-auto">
                    <a href="/register" class="nav-link p-2 ">Регистрация</a>
                </li>
                {% endif %}
            </ul>
        </div>
    </nav>
</header>
<div class="row">
    <main>
        {% block content %}{% endblock %}
    </main>
</div>
<p>&nbsp;</p>
<div class="fixed-bottom padding-left first_page">
    <footer class="bg-black text-grey text-left py-1 font-monospace">
        <p>&copy; 2025 &dash; Компания "Настойки для настолки"</p>
    </footer>
</div>
</div>
</body>
</html>
